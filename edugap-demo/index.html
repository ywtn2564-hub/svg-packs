<style>
:root{--p:#4F46E5;--p-soft:#eef0ff;--s:#60A5FA;--bg:#F8FAFC;--sf:#fff;--ink:#1E293B;--mut:#64748b;--line:#e2e8f0;--ok:#16A34A;--warn:#F59E0B;--bad:#EF4444;--r:14px}
*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;cursor:pointer}
.demo{background:#fff7e0;color:#92400e;font-size:13px;padding:8px 16px;text-align:center;border-bottom:1px solid #f3dca0}
.app{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 36px)}
aside{background:var(--sf);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:calc(100vh - 36px)}
.logo{display:flex;gap:10px;align-items:center;font-weight:700;font-size:19px;padding:4px 10px 2px}.logo .d{width:34px;height:34px;border-radius:10px;background:var(--p);color:#fff;display:grid;place-items:center}
.tagl{font-size:12px;color:var(--mut);padding:0 10px 14px}
.nav button{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;padding:11px 12px;border-radius:10px;color:var(--mut);font-weight:500;text-align:left}
.nav button:hover{background:var(--bg)}.nav button.on{background:var(--p-soft);color:var(--p)}
.role{margin-top:auto;border:1px solid var(--line);border-radius:12px;padding:6px;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.role button,.mrole button{border:0;background:none;padding:8px;border-radius:8px;color:var(--mut);font-weight:500}.role button.on,.mrole button.on{background:var(--ink);color:#fff}
main{padding:28px 32px 70px;max-width:1120px;width:100%}
h1{font-size:24px;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 22px}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:20px}.card h3{margin:0 0 12px;font-size:16px}
.stat .n{font-size:28px;font-weight:700;line-height:1.15}.stat .l{color:var(--mut);font-size:13px}
.btn{display:inline-flex;gap:8px;align-items:center;border:0;background:var(--p);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600}
.btn.gh{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:6px 12px;font-size:13px}.btn:disabled{opacity:.45;cursor:default}
:is(.btn,.nav button,input,select,textarea,.chip,.tile,.opt):focus-visible{outline:3px solid #a5b4fc;outline-offset:2px}
input,select,textarea{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.list>*+*{border-top:1px solid var(--line)}.it{padding:12px 0}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--bg);color:var(--mut)}
.b-strong{background:#dcfce7;color:#166534}.b-dev{background:#fef3c7;color:#92400e}.b-review{background:#fee2e2;color:#991b1b}.b-na{background:#e2e8f0;color:#475569}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.tile{border:0;border-radius:12px;padding:16px;text-align:left;color:#fff;min-height:96px}.tile b{display:block}.tile span{font-size:26px;font-weight:700}
.t-strong{background:var(--ok)}.t-dev{background:var(--warn);color:#2b1c00}.t-review{background:var(--bad)}.t-na{background:#94a3b8}
.tile.sel{box-shadow:0 0 0 3px var(--p)}
.note{display:flex;gap:10px;background:var(--p-soft);color:#312e81;padding:12px 14px;border-radius:12px;font-size:14px;margin-bottom:16px}
.warnbox{background:#fff7e0;color:#92400e}
.empty{text-align:center;color:var(--mut);padding:26px}
.cb{position:relative;height:270px}
.bar{height:8px;background:var(--bg);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--p)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:10px;font-weight:600}.chip.ans{background:var(--p-soft);border-color:#c7d2fe;color:var(--p)}.chip.cur{background:var(--p);color:#fff;border-color:var(--p)}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:#fff;padding:14px;border-radius:12px;margin-top:10px}.opt.on{border-color:var(--p);background:var(--p-soft)}
.opt .r{width:20px;height:20px;border:2px solid #cbd5e1;border-radius:50%;flex:none}.opt.on .r{border-color:var(--p);background:radial-gradient(var(--p) 45%,transparent 50%)}
.ok{color:var(--ok)}.no{color:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;z-index:20;padding:16px}.modal .card{max-width:420px;width:100%}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;display:flex;gap:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}.toast.show{opacity:1}
.mrole{display:none;gap:6px;margin-bottom:14px}.mrole button{flex:1;border:1px solid var(--line);background:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
@media(max-width:860px){.app{grid-template-columns:1fr}aside{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:6px;z-index:5;border-right:0;border-top:1px solid var(--line)}.logo,.tagl,.role{display:none}.nav{display:flex;width:100%}.nav button{flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;align-items:center;justify-content:center;text-align:center}.g4,.g3{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}main{padding:18px 14px 110px}.mrole{display:flex}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
const ICONS={"chevron-left": "<path d=\"m15 18-6-6 6-6\" />", "chevron-right": "<path d=\"m9 18 6-6-6-6\" />", "circle-check": "<circle cx=\"12\" cy=\"12\" r=\"10\" />\n  <path d=\"m9 12 2 2 4-4\" />", "clipboard-list": "<rect width=\"8\" height=\"4\" x=\"8\" y=\"2\" rx=\"1\" ry=\"1\" />\n  <path d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\" />\n  <path d=\"M12 11h4\" />\n  <path d=\"M12 16h4\" />\n  <path d=\"M8 11h.01\" />\n  <path d=\"M8 16h.01\" />", "graduation-cap": "<path d=\"M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z\" />\n  <path d=\"M22 10v6\" />\n  <path d=\"M6 12.5V16a6 3 0 0 0 12 0v-3.5\" />", "layout-dashboard": "<rect width=\"7\" height=\"9\" x=\"3\" y=\"3\" rx=\"1\" />\n  <rect width=\"7\" height=\"5\" x=\"14\" y=\"3\" rx=\"1\" />\n  <rect width=\"7\" height=\"9\" x=\"14\" y=\"12\" rx=\"1\" />\n  <rect width=\"7\" height=\"5\" x=\"3\" y=\"16\" rx=\"1\" />", "lightbulb": "<path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5\" />\n  <path d=\"M9 18h6\" />\n  <path d=\"M10 22h4\" />", "lock": "<rect width=\"18\" height=\"11\" x=\"3\" y=\"11\" rx=\"2\" ry=\"2\" />\n  <path d=\"M7 11V7a5 5 0 0 1 10 0v4\" />", "plus": "<path d=\"M5 12h14\" />\n  <path d=\"M12 5v14\" />", "school": "<path d=\"M14 21v-3a2 2 0 0 0-4 0v3\" />\n  <path d=\"M18 5v16\" />\n  <path d=\"m4 6 7.106-3.79a2 2 0 0 1 1.788 0L20 6\" />\n  <path d=\"m6 11-3.52 2.147a1 1 0 0 0-.48.854V19a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5a1 1 0 0 0-.48-.853L18 11\" />\n  <path d=\"M6 5v16\" />\n  <circle cx=\"12\" cy=\"9\" r=\"2\" />", "settings": "<path d=\"M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915\" />\n  <circle cx=\"12\" cy=\"12\" r=\"3\" />", "trash-2": "<path d=\"M10 11v6\" />\n  <path d=\"M14 11v6\" />\n  <path d=\"M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6\" />\n  <path d=\"M3 6h18\" />\n  <path d=\"M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2\" />", "trending-up": "<path d=\"M16 7h6v6\" />\n  <path d=\"m22 7-8.5 8.5-5-5L2 17\" />", "users": "<path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\" />\n  <path d=\"M16 3.128a4 4 0 0 1 0 7.744\" />\n  <path d=\"M22 21v-2a4 4 0 0 0-3-3.87\" />\n  <circle cx=\"9\" cy=\"7\" r=\"4\" />"};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||''}</svg>`;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MIN_N=5, DAY=864e5, NOW=Date.now();

/* ===== DEMO DATA (ไม่ใช่ข้อมูลจริง) ===== */
const CLASS={name:'ม.2/1 คณิตศาสตร์',subject:'คณิตศาสตร์',grade:'ม.2',code:'EDU-4821',desc:'สมการเชิงเส้นตัวแปรเดียว'};
const TOPICS=[{id:'t1',name:'ความเข้าใจตัวแปร'},{id:'t2',name:'การย้ายพจน์'},{id:'t3',name:'การแก้สมการเชิงเส้น'},{id:'t4',name:'การแทนค่าและตรวจคำตอบ'}];
const TF=['ถูก','ผิด'];
const Q=[
 {id:'q1',t:'t1',type:'mc',text:'ในสมการ 3x + 5 = 20 ตัวแปรคือข้อใด',o:['x','3','5','20'],c:0,ex:'ตัวแปรคือสัญลักษณ์ที่แทนค่าที่ยังไม่ทราบ ในที่นี้คือ x',pt:1},
 {id:'q2',t:'t1',type:'tf',text:'ตัวแปรคือสัญลักษณ์ที่ใช้แทนค่าที่ยังไม่ทราบ',o:TF,c:0,ex:'ถูกต้อง เช่น x, y แทนจำนวนที่ต้องหา',pt:1},
 {id:'q3',t:'t1',type:'mc',text:'สัมประสิทธิ์ของ x ใน 7x − 2 คือข้อใด',o:['7','−2','x','2'],c:0,ex:'สัมประสิทธิ์คือตัวเลขที่คูณอยู่หน้าตัวแปร จึงเป็น 7',pt:1},
 {id:'q4',t:'t2',type:'mc',text:'จาก x + 6 = 10 เมื่อย้าย 6 ไปอีกข้าง จะได้',o:['x = 10 − 6','x = 10 + 6','x = 6 − 10','x = 6 + 10'],c:0,ex:'ย้ายพจน์ข้ามเครื่องหมายเท่ากับต้องเปลี่ยนเครื่องหมาย + เป็น −',pt:1},
 {id:'q5',t:'t2',type:'tf',text:'เมื่อย้ายพจน์ข้ามเครื่องหมายเท่ากับ ต้องเปลี่ยนเครื่องหมายของพจน์นั้น',o:TF,c:0,ex:'ถูกต้อง เพราะเป็นการบวกหรือลบทั้งสองข้างด้วยค่าเดียวกัน',pt:1},
 {id:'q6',t:'t2',type:'mc',text:'จาก 2x − 4 = 6 จะได้ 2x เท่ากับ',o:['10','2','−10','6'],c:0,ex:'ย้าย −4 เป็น +4 จะได้ 2x = 6 + 4 = 10',pt:1},
 {id:'q7',t:'t3',type:'mc',text:'ถ้า 3x = 12 แล้ว x เท่ากับ',o:['4','9','15','36'],c:0,ex:'หารทั้งสองข้างด้วย 3 ได้ x = 4',pt:1},
 {id:'q8',t:'t3',type:'mc',text:'คำตอบของ 2x + 5 = 17 คือ',o:['6','11','4','5'],c:0,ex:'2x = 12 จึงได้ x = 6',pt:1},
 {id:'q9',t:'t3',type:'tf',text:'สมการ x + 3 = 3 มีคำตอบคือ x = 6',o:TF,c:1,ex:'ผิด เพราะ x = 3 − 3 = 0',pt:1},
 {id:'q10',t:'t4',type:'mc',text:'เมื่อแทน x = 2 ใน 4x − 1 จะได้ค่าเท่าไร',o:['7','9','5','8'],c:0,ex:'4(2) − 1 = 8 − 1 = 7',pt:1},
 {id:'q11',t:'t4',type:'tf',text:'ถ้าแทนค่าแล้วทั้งสองข้างของสมการเท่ากัน แสดงว่าค่านั้นเป็นคำตอบ',o:TF,c:0,ex:'ถูกต้อง นี่คือการตรวจสอบคำตอบ',pt:1},
 {id:'q12',t:'t4',type:'mc',text:'สมการใดที่มี x = 5 เป็นคำตอบ',o:['x + 2 = 7','x − 2 = 7','2x = 5','x + 5 = 5'],c:0,ex:'แทน x = 5 ใน x + 2 ได้ 7 ตรงกับด้านขวา',pt:1},
];
const A=[
 {id:'a1',title:'แบบทดสอบ: สมการเชิงเส้นตัวแปรเดียว',qs:Q.map(q=>q.id),pub:true,retake:true},
 {id:'a2',title:'แบบฝึกหัด: การแก้สมการและการแทนค่า',qs:['q7','q8','q9','q10','q11','q12'],pub:false,retake:true},
];
let TH={strong:80,dev:50}; // ครูปรับได้
let members=['me',...Array.from({length:24},(_,i)=>'s'+(i+1))];
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(20261108),P={t1:.88,t2:.62,t3:.42,t4:.7};
const AT=[];
members.slice(1).forEach((s,i)=>{const ans={};Q.forEach(q=>{const ok=R()<Math.min(.97,Math.max(.1,P[q.t]+(R()-.5)*.3));ans[q.id]=ok?q.c:(q.o.map((_,k)=>k).filter(k=>k!==q.c)[Math.floor(R()*(q.o.length-1))])});AT.push({id:'h'+i,st:s,a:'a1',at:NOW-(10+i%10)*DAY,ans})});
const wrong=q=>q.o.findIndex((_,k)=>k!==q.c);
AT.push({id:'me1',st:'me',a:'a1',at:NOW-21*DAY,ans:Object.fromEntries(Q.map(q=>[q.id,['q1','q2','q3','q4','q10','q11'].includes(q.id)?q.c:wrong(q)]))});
const ME='me';

/* ===== ENGINE (deterministic, ไม่ใช้ AI) ===== */
const level=m=>m==null?'na':m>=TH.strong?'strong':m>=TH.dev?'dev':'review';
const LBL={strong:'เข้าใจดี',dev:'กำลังพัฒนา',review:'ควรทบทวน',na:'ยังไม่ได้ประเมิน'};
function analyze(at){ // topic mastery = correct / answered (หัวข้อที่ไม่ได้ตอบ = Not Assessed ไม่ใช่ 0%)
 const qs=A.find(a=>a.id===at.a).qs.map(id=>Q.find(q=>q.id===id));let tot=0,got=0;const per={};
 TOPICS.forEach(t=>per[t.id]={n:0,ok:0,m:null});
 qs.forEach(q=>{tot+=q.pt;const v=at.ans[q.id];if(v==null)return;per[q.t].n++;if(v===q.c){per[q.t].ok++;got+=q.pt}});
 TOPICS.forEach(t=>{const p=per[t.id];p.m=p.n?Math.round(p.ok/p.n*100):null;p.lv=level(p.m)});
 return{score:Math.round(got/tot*100),got,tot,per};
}
function latestPerTopic(st,filter={}){ // ผลล่าสุดของแต่ละหัวข้อ (เฉพาะที่ประเมินแล้ว)
 const out={};AT.filter(a=>a.st===st&&inF(a,filter)).sort((x,y)=>x.at-y.at).forEach(a=>{const r=analyze(a);TOPICS.forEach(t=>{if(r.per[t.id].m!=null)out[t.id]=r.per[t.id].m})});return out}
const inF=(a,f)=>(!f.a||a.a===f.a)&&(!f.days||a.at>=NOW-f.days*DAY);
function classAgg(f){
 const ms=members.filter(m=>AT.some(a=>a.st===m&&inF(a,f)));const per={};
 TOPICS.forEach(t=>per[t.id]={vals:[]});
 ms.forEach(m=>{const l=latestPerTopic(m,f);TOPICS.forEach(t=>{if(l[t.id]!=null)per[t.id].vals.push(l[t.id])})});
 TOPICS.forEach(t=>{const v=per[t.id].vals;const p=per[t.id];p.n=v.length;p.avg=v.length?Math.round(v.reduce((x,y)=>x+y,0)/v.length):null;p.lv=level(p.avg);
  p.cnt={strong:0,dev:0,review:0};v.forEach(x=>p.cnt[level(x)]++);p.pctReview=v.length?Math.round(p.cnt.review/v.length*100):null});
 const sc=ms.map(m=>{const l=AT.filter(a=>a.st===m&&inF(a,f)).sort((x,y)=>y.at-x.at)[0];return analyze(l).score});
 return{n:ms.length,per,avg:sc.length?Math.round(sc.reduce((x,y)=>x+y,0)/sc.length):null};
}
function rec(topic,m){ // กฎสำเร็จรูป
 const nxt=TOPICS[TOPICS.findIndex(t=>t.id===topic.id)+1];
 if(m==null)return{act:'ยังไม่มีข้อมูล ลองทำแบบทดสอบที่ครอบคลุมหัวข้อนี้',next:'ทำแบบทดสอบที่เปิดอยู่'};
 if(m<TH.dev)return{act:'ทบทวนแนวคิดพื้นฐานของหัวข้อนี้ และดูตัวอย่างพร้อมเฉลยทีละขั้น',next:'ทำแบบฝึกหัดง่ายๆ 3–5 ข้อ แล้วทำแบบทดสอบซ้ำ'};

 res:()=>{const at=AT.find(x=>x.id===S.result),a=A.find(x=>x.id===at.a),r=analyze(at);
  return head('ผลของคุณ',esc(a.title))+`<div class="grid g2"><div class="card stat"><div class="n">${r.score}%</div><div class="l">ได้ ${r.got} จาก ${r.tot} คะแนน</div></div><div class="card"><h3>ความเข้าใจรายหัวข้อ</h3>${tiles(Object.fromEntries(TOPICS.map(t=>[t.id,{m:r.per[t.id].m}])),null,false)}</div></div>
  <div class="card" style="margin-top:16px"><h3>เฉลยและคำอธิบาย</h3><div class="list">${a.qs.map((id,k)=>{const q=Q.find(x=>x.id===id),v=at.ans[id];return`<div class="it"><b>${k+1}. ${esc(q.text)}</b><div class="${v===q.c?'ok':'no'}">${v==null?'ไม่ได้ตอบ':'คำตอบของคุณ: '+esc(q.o[v])}</div>${v===q.c?'':`<div>เฉลย: ${esc(q.o[q.c])}</div>`}<div style="color:var(--mut);font-size:14px">${esc(q.ex)}</div></div>`}).join('')}</div></div>
  <div style="margin-top:16px"><button class="btn" data-v="sdash">ดูแผนที่ความรู้และคำแนะนำ</button></div>`},
};
const AF={
 dash:()=>{if(!$('#c1'))return;const g=classAgg(S.f);charts.push(new Chart($('#c1'),{type:'bar',data:{labels:TOPICS.map(t=>t.name),datasets:[{data:TOPICS.map(t=>g.per[t.id].avg),backgroundColor:'#4F46E5',borderRadius:6}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{min:0,max:100}}}}))},
 sprog:()=>{if(!$('#c3'))return;const mine=AT.filter(a=>a.st===ME&&a.a==='a1').sort((x,y)=>x.at-y.at);const cols=['#4F46E5','#60A5FA','#F59E0B','#16A34A'];
  charts.push(new Chart($('#c3'),{type:'line',data:{labels:mine.map((_,i)=>'ครั้งที่ '+(i+1)),datasets:TOPICS.map((t,k)=>({label:t.name,data:mine.map(a=>analyze(a).per[t.id].m),borderColor:cols[k],backgroundColor:cols[k],tension:.25}))},options:{maintainAspectRatio:false,scales:{y:{min:0,max:100}},plugins:{legend:{position:'bottom',labels:{boxWidth:10}}}}}))},
};
const modal=h=>$('#modal').innerHTML=h?`<div class="modal"><div class="card">${h}</div></div>`:'';
const DO={
 seltopic:d=>{S.sel=S.sel===d.id?null:d.id;render()},
 rm:d=>{members=members.filter(m=>m!==d.id);toast('นำสมาชิกออกแล้ว');render()},
 pub:d=>{const a=A.find(x=>x.id===d.id);a.pub=!a.pub;toast(a.pub?'เผยแพร่แล้ว':'ยกเลิกเผยแพร่แล้ว');render()},
 retk:d=>{const a=A.find(x=>x.id===d.id);a.retake=!a.retake;render()},
 addq:()=>{const x=$('#qx').value.trim(),y=$('#qy').value,c=+$('#qc').value;let o=y==='tf'?TF:[1,2,3,4].map(i=>$('#qo'+i).value.trim());
  if(!x)return toast('กรุณาใส่โจทย์');if(y==='mc'&&o.some(v=>!v))return toast('กรุณากรอกตัวเลือกให้ครบ 4 ข้อ');if(c>=o.length)return toast('เฉลยต้องอยู่ในตัวเลือกที่มี');
  const q={id:'q'+(Date.now()%1e7),t:$('#qt').value,type:y,text:x,o,c,ex:$('#qe').value.trim()||'—',pt:1};Q.push(q);A.find(a=>a.id===$('#qa').value).qs.push(q.id);toast('เพิ่มคำถามแล้ว');render()},
 saveth:()=>{const s=+$('#th1').value,d=+$('#th2').value;if(!(s>d&&d>=0&&s<=100))return toast('เกณฑ์ “เข้าใจดี” ต้องมากกว่า “กำลังพัฒนา”');TH={strong:s,dev:d};toast('บันทึกเกณฑ์แล้ว');render()},
 start:d=>{S.exam={a:d.id,i:0,ans:{},busy:false};S.view='exam';render()},
 pick:d=>{S.exam.ans[d.q]=+d.k;render()},
 nav:d=>{S.exam.i+=+d.d;render()},go:d=>{S.exam.i=+d.i;render()},
 leave:()=>{S.exam=null;S.view='sasm';render()},
 confirm:()=>{const a=A.find(x=>x.id===S.exam.a),un=a.qs.length-Object.keys(S.exam.ans).length;
  modal(`<h3>ส่งคำตอบ?</h3><p>${un?`ยังมี ${un} ข้อที่ยังไม่ได้ตอบ ข้อเหล่านี้จะไม่นับเป็นคะแนน และหัวข้อที่ไม่มีคำตอบเลยจะแสดงเป็น “ยังไม่ได้ประเมิน”`:'ตอบครบทุกข้อแล้ว'}</p><div class="row"><button class="btn" data-do="submit">ยืนยันส่ง</button><button class="btn gh" data-do="cancel">กลับไปตรวจ</button></div>`)},
 cancel:()=>modal(''),
 submit:()=>{if(!S.exam||S.exam.busy)return;S.exam.busy=true;modal('');const at={id:'me'+Date.now(),st:ME,a:S.exam.a,at:Date.now(),ans:{...S.exam.ans}};AT.push(at);S.result=at.id;S.exam=null;S.view='res';toast('ส่งคำตอบแล้ว');render()},
 viewres:d=>{S.result=d.id;S.view='res';render()},
 join:()=>{const c=$('#jc').value.trim().toUpperCase();if(c===CLASS.code)return toast('คุณอยู่ในห้องนี้แล้ว (ป้องกันการเข้าร่วมซ้ำ)');toast('ไม่พบรหัสห้องเรียนนี้')},
};
render();
</script>
</body>
</html>
